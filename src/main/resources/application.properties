spring.application.name=product-search-api
context.path=/productSearch

# Server
server.port=8080
# server.servlet.context-path=/api

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/product_search_db
spring.data.mongodb.database=product_search_db

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
# spring.elasticsearch.username=
# spring.elasticsearch.password=

# Logging
# logging.level.root=INFO
# logging.level.com.example.productsearch=DEBUG

# Application
product.search.cache.enabled=true
product.search.elasticsearch.enabled=true
